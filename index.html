<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0e">
<meta name="description" content="Die digitale Kontaktkarte von Jonas Bock.">
<title>Jonas Bock · Digitale Kontaktkarte</title>

<style>
:root {
  --bg: #080b0e;
  --text: #f5f7fb;
  --muted: #9ba9bc;
  --line: #263442;
  --accent: #b6f66d;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 34px 18px 28px;
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(
    ellipse at 50% 20%,
    #18221e 0%, #0b1014 38%, var(--bg) 76%
  );
}

main {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.status {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  margin: 0 4px 24px;
  color: var(--accent);
  font-size: 11px;
  letter-spacing: .17em;
  font-weight: 700;
}

.nfc-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 15px #b6f66d;
}

.profile {
  text-align: center;
  padding-bottom: 30px;
}

.avatar {
  width: 156px;
  height: 156px;
  object-fit: cover;
  object-position: center 30%;
  border: 4px solid var(--accent);
  border-radius: 50%;
  display: block;
  margin: 0 auto 28px;
  box-shadow: 0 0 34px #b6f66d22;
  background: #e8e8e8;
}

h1 {
  font-size: clamp(36px, 9vw, 54px);
  letter-spacing: -.055em;
  line-height: 1.02;
  margin: 0;
  font-weight: 800;
}

.role {
  font-size: clamp(15px, 4vw, 19px);
  color: var(--muted);
  margin: 16px 0 0;
}

.actions {
  display: grid;
  gap: 13px;
}

.action {
  min-height: 88px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 17px 22px;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: linear-gradient(115deg, #0d141a, #0a0f14);
  color: var(--text);
  text-decoration: none;
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: transform .18s, border-color .18s;
}

.action:hover {
  transform: translateY(-2px);
  border-color: #b6f66d80;
}

.action.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b1107;
  min-height: 94px;
}

.action.primary:hover { background: #c8ff8b; }

.icon {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: grid;
  place-items: center;
  color: var(--accent);
}

.primary .icon { color: #10170b; }

.icon svg {
  width: 35px;
  height: 35px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.copy {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  gap: 4px;
}

.copy strong {
  font-size: 18px;
  font-weight: 750;
  letter-spacing: -.02em;
}

.copy small {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.primary .copy small { color: #304022; }

.arrow {
  font-size: 28px;
  line-height: 1;
  color: #9eacbd;
}

.primary .arrow { color: #11190b; }

.socials {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 30px 0 32px;
}

.social {
  width: 130px;
  min-height: 105px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 23px;
  color: var(--text);
  text-decoration: none;
  background: #0b1117;
  transition: border-color .18s, transform .18s;
}

.social:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.social svg {
  width: 31px;
  height: 31px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.social b {
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}

.architecture {
  margin: 0 auto;
  text-align: center;
  color: var(--accent);
}

.architecture svg {
  display: block;
  width: 100%;
  height: 55px;
}

.tagline {
  margin-top: 12px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .23em;
  text-align: center;
}

footer {
  text-align: center;
  color: #667384;
  font-size: 11px;
  margin-top: 28px;
}

@media (max-width: 390px) {
  body { padding: 25px 13px; }
  .avatar { width: 138px; height: 138px; }
  .action {
    padding: 15px 16px;
    gap: 14px;
    border-radius: 19px;
  }
  .copy strong { font-size: 16px; }
  .copy small { font-size: 12px; }
  .social { width: 45%; min-height: 90px; }
}
</style>
</head>

<body>
<main>
  <div class="status">
    <span class="nfc-dot"></span>
    <span>◖)) &nbsp; NFC READY</span>
  </div>

  <header class="profile">
    <!-- Profilbild aktualisiert zu IMG_2741.jpg -->
    <img
      class="avatar"
      src="IMG_2741.jpg"
      alt="Profilbild von Jonas Bock"
    >

    <h1>Jonas Bock</h1>
    <p class="role">Bauingenieurwesen · FH Erfurt</p>
  </header>

  <section class="actions" aria-label="Kontaktmöglichkeiten">

    <button class="action primary" id="saveContact" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="9" cy="7" r="4"/>
          <path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v8M15 12h8"/>
        </svg>
      </span>
      <span class="copy">
        <strong>Kontakt speichern</strong>
        <small>Zu deinen Kontakten hinzufügen</small>
      </span>
      <span class="arrow">›</span>
    </button>

    <!-- Separate E-Mail: Privat -->
    <a class="action" href="mailto:Jonas.bock@bock-familie.de">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m3 6 9 7 9-7"/>
        </svg>
      </span>
      <span class="copy">
        <strong>E-Mail (Privat)</strong>
        <small>Jonas.bock@bock-familie.de</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <!-- Separate E-Mail: Universität -->
    <a class="action" href="mailto:jonas.bock@fh-erfurt.de">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m3 6 9 7 9-7"/>
        </svg>
      </span>
      <span class="copy">
        <strong>E-Mail (FH Erfurt)</strong>
        <small>jonas.bock@fh-erfurt.de</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="action" href="tel:+491711578750">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 18a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.2 2 2 0 0 1 4.1 1h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>
        </svg>
      </span>
      <span class="copy">
        <strong>Telefon</strong>
        <small>+49 171 1578750 · Direkt anrufen</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <button class="action" id="sharePage" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <path d="m8.6 10.6 6.8-4.2m-6.8 9.2 6.8 4.2"/>
        </svg>
      </span>
      <span class="copy">
        <strong>Profil teilen</strong>
        <small>Kontaktseite weitergeben</small>
      </span>
      <span class="arrow">›</span>
    </button>
  </section>

  <nav class="socials" aria-label="Social Media">
    <a class="social"
       href="https://www.linkedin.com/in/jonas-bock-72ab62283?utm_source=share_via&amp;utm_content=profile&amp;utm_medium=member_ios"
       target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24">

      </svg>
      <b>LinkedIn</b>

    <a class="social"
       href="https://instagram.com/jonas_bock_2006?psln=aWt5ZWN5YnlqZWpi&amp;utm_source=qr"
       target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24">

  <div class="architecture" aria-label="Bauen, Planen, Zukunft gestalten">
    <svg viewBox="0 0 460 55" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.1"
         fill="none" stroke-linejoin="round">
        <path d="M0 45H145 M315 45H460"/>
        <path d="M155 45h18V29h17v16h10V36h13v9h10V17h7v28h10V9h7v36h8V2h7v43h10V31h16l-16 14h36l-18-14"/>

  </div>

  <footer>
    © <span id="year"></span> Jonas Bock · Digitale Visitenkarte
  </footer>
</main>

<script>
const person = {
  firstName: "Jonas",
  lastName: "Bock",
  organization: "FH Erfurt",
  title: "Bauingenieurwesen",
  emailPrivate: "Jonas.bock@bock-familie.de",
  emailUniversity: "jonas.bock@fh-erfurt.de",
  phone: "+491711578750"
};

document.getElementById("year").textContent =
  new Date().getFullYear();

document.getElementById("saveContact").addEventListener("click", () => {
  const esc = value =>
    String(value)
      .replace(/([,;\\])/g, "\\$1")
      .replace(/\n/g, "\\n");

  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(person.lastName)};${esc(person.firstName)};;;`,
    `FN:${esc(person.firstName + " " + person.lastName)}`,
    `ORG:${esc(person.organization)}`,
    `TITLE:${esc(person.title)}`,
    `EMAIL;TYPE=HOME:${esc(person.emailPrivate)}`,
    `EMAIL;TYPE=WORK:${esc(person.emailUniversity)}`,
    `TEL;TYPE=CELL:${esc(person.phone)}`,
    `URL:${esc(window.location.href)}`,
    "END:VCARD"
  ];

  const blob = new Blob(
    [lines.join("\r\n")],
    { type: "text/vcard;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Jonas-Bock.vcf";
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

document.getElementById("sharePage").addEventListener("click", async () => {
  const data = {
    title: "Jonas Bock · Digitale Kontaktkarte",
    text: "Hier findest du meine Kontaktdaten.",
    url: window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(data);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(window.location.href);
      alert("Link kopiert!");
    } else {
      prompt("Kopiere den Link zu deiner Kontaktseite:", window.location.href);
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      prompt("Kopiere den Link:", window.location.href);
    }
  }
});
</script>
</body>
</html>
